<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoa Tặc App</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

  <header class="app-header">
    <div class="navbar">
      <div class="nav-top">
        <img src="https://csnnjdfrngfxtslrqfmp.supabase.co/storage/v1/object/public/img/hoatac-logo.png" class="logo">
      </div>

      <div class="nav-menu">
        <div class="nav-item active">HOA TƯƠI</div>
        <div class="nav-item">THÀNH VIÊN</div>
        <div class="nav-item">QUẢN LÝ</div>
      </div>

      <!-- SEARCH (giữ nguyên cho màn Hoa tươi) -->
      <div class="search-wrapper">
        <input id="searchInput" placeholder="Tìm kiếm..." oninput="handleSearch()" />

        <div class="search-icon" onclick="handleSearch()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
        </div>

        <div id="selectedTag" class="tag hidden">
          <img id="tagImg" />
          <span id="tagText"></span>
          <span id="tagRemove">✕</span>
        </div>

        <!-- <div id="suggestions"></div> -->
      </div>
    </div>
  </header>

  <main class="container">
    <div id="result"></div>
  </main>

  <script src="js/script.js"></script>
  <div id="toast" class="toast hidden"></div>
  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal">
    <div class="modal-box pw-box">
      <div class="pw-title">🔑</div>

      <input id="loginEmail" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Mật khẩu"
        onkeypress="if(event.key==='Enter') handleLogin()">

      <div class="pw-actions">
        <button class="btn primary" onclick="handleLogin()">Đăng nhập</button>
        <button class="btn ghost" onclick="closeLoginModal()">Huỷ</button>
      </div>
    </div>
  </div>

  <!-- PASSWORD MODAL -->
  <div id="pwModal" class="modal">
    <div class="modal-box pw-box">
      <div class="pw-title">🔒</div>

      <input id="pwInput" type="password" placeholder="Nhập mật khẩu..."
        onkeypress="if(event.key==='Enter') confirmEdit()">

      <div class="pw-actions">
        <button class="btn primary" onclick="confirmEdit()">Xác nhận</button>
        <button class="btn ghost" onclick="closePwModal()">Huỷ</button>
      </div>
    </div>
  </div>
</body>

</html>
